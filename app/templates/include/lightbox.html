{% load i18n %}
{% comment %}
    Просмотр фотографий поверх страницы.

    Разметка пустая: содержимое подставляет скрипт при первом открытии.
    Ссылки в галереях остаются обычными — если скрипт не загрузился,
    снимок откроется в соседней вкладке, как раньше.
{% endcomment %}
<div class="lightbox" data-lightbox-box hidden>
    <div class="lightbox__backdrop" data-lightbox-close></div>

    <button class="lightbox__close" type="button" data-lightbox-close
            aria-label="{% translate 'Закрыть' %}">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round"/>
        </svg>
    </button>

    <button class="lightbox__nav lightbox__nav--prev" type="button" data-lightbox-prev
            aria-label="{% translate 'Предыдущее фото' %}">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <figure class="lightbox__figure" role="dialog" aria-modal="true" tabindex="-1">
        <img class="lightbox__image" data-lightbox-image src="" alt="">
        <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
    </figure>

    <button class="lightbox__nav lightbox__nav--next" type="button" data-lightbox-next
            aria-label="{% translate 'Следующее фото' %}">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <span class="lightbox__counter" data-lightbox-counter></span>
</div>
