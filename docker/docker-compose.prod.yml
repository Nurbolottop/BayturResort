name: baitur

# Redis в проекте не используется (кеш и очереди не подключены), поэтому
# в прод-конфиге его нет — на сервере дорога каждая сотня мегабайт RAM.

services:
  db_baitur:
    image: postgres:14
    container_name: postgres_db_baitur
    restart: always
    env_file:
      - ../.env
    volumes:
      - postgres_data_baitur:/var/lib/postgresql/data
    networks:
      - baitur_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  web_baitur:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: django_web_baitur
    restart: always
    command: sh -c "/entrypoint.sh && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --max-requests 400 --max-requests-jitter 50"
    volumes:
      - ../app:/app
      - ../app/static:/app/static
      - ../app/media:/app/media
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    depends_on:
      db_baitur:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8000"
    networks:
      - baitur_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  baitur_network:
    driver: bridge

volumes:
  postgres_data_baitur:
